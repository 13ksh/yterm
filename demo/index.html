<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KPixel 채널 필터</title>
    <link rel="icon" href="/icons/icon32.png" type="image/png" />
    <link rel="stylesheet" href="/demo/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="logo">
          <img src="/icons/icon48.png" alt="" width="36" height="36" />
          <div>
            <strong>KPixel 채널 필터</strong>
            <span>Chrome 확장 프로그램</span>
          </div>
        </div>
        <p class="lead">
          <code>del.kpixel.net/채널ID</code>가 <em>t</em>이면 유튜브 댓글, 게시물,
          쇼츠 피드, 동영상 피드에서 그 채널을 숨깁니다. 검색 결과는 그대로 둡니다.
        </p>
        <ol>
          <li>Chrome에서 <code>chrome://extensions</code>를 엽니다.</li>
          <li>오른쪽 위 개발자 모드를 켭니다.</li>
          <li><strong>압축해제된 확장 프로그램을 로드</strong>로 이 저장소 폴더를 선택합니다.</li>
          <li>유튜브를 새로고침하면 바로 동작합니다.</li>
        </ol>
        <div class="lookup-card">
          <label for="liveId">실제 API 조회</label>
          <div class="row">
            <input id="liveId" maxlength="24" placeholder="UC…" spellcheck="false" value="UCXuqSBlHAE6Xw-yeJA0Tunw" />
            <button id="liveBtn" type="button">확인</button>
          </div>
          <p id="liveOut">채널 ID를 넣으면 t / f를 그대로 보여 줍니다.</p>
        </div>
      </aside>

      <main>
        <nav class="tabs" role="tablist">
          <button type="button" data-view="home" class="on">홈 피드</button>
          <button type="button" data-view="shorts">쇼츠</button>
          <button type="button" data-view="comments">댓글</button>
          <button type="button" data-view="posts">게시물</button>
          <button type="button" data-view="search">검색</button>
        </nav>
        <p class="hint" id="hint"></p>
        <div id="feed" class="feed"></div>
        <p class="count" id="count"></p>
      </main>
    </div>
    <script src="/shared.js"></script>
    <script src="/demo/app.js"></script>
  </body>
</html>
